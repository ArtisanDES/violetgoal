<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 - 紫域进球</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="glow glow-a"></div><div class="glow glow-b"></div>
    <header class="site-header">
      <div class="nav">
        <a class="logo" href="./index.html"><span>球</span><strong>紫域进球</strong></a>
        <nav><a href="./index.html#predictions">今日预测</a><a href="./results.html">命中记录</a><a href="./live.html">实时直播</a></nav>
      </div>
    </header>
    <main class="login-main">
      <section class="login-intro">
        <span class="label">账号登录</span>
        <h1>登录紫域进球</h1>
        <p>登录后查看会员预测、直播聊天室和个人复盘记录。</p>
        <div class="login-benefits">
          <span>赛前预测快照</span>
          <span>永久复盘记录</span>
          <span>会员数据分析</span>
        </div>
      </section>
      <section class="login-section">
        <form class="login-panel">
          <div class="login-panel-head">
            <span>WELCOME BACK</span>
            <h2>欢迎回来</h2>
            <p>输入账号信息继续访问。</p>
          </div>
          <label>手机号 / 邮箱<input type="text" autocomplete="username" placeholder="请输入账号" /></label>
          <label>密码<input type="password" autocomplete="current-password" placeholder="请输入密码" /></label>
          <div class="login-options"><label><input type="checkbox" />记住账号</label><a href="#">忘记密码？</a></div>
          <button class="solid-button" type="button">登录</button>
          <small>登录即表示你同意平台服务条款与隐私政策</small>
        </form>
      </section>
    </main>
  </body>
</html>
